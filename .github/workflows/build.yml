name: Build SORYN AI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Create Root build.gradle if missing
      run: |
        if [ ! -f build.gradle ]; then
          echo "plugins { id 'com.android.application' version '8.2.0' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }" > build.gradle
        fi
        if [ ! -f settings.gradle ]; then
          echo "rootProject.name = 'SORYN AI'; include ':app'" > settings.gradle
        fi

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: soryn-ai-apk
        path: app/build/outputs/apk/debug/app-debug.apk
